plugins {
    id 'java'
}

version = '1.0.0'
group = 'com.nexuskin'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Usamos 'compileOnly' porque o ASM será injetado via reflection ou 
    // precisamos de um jar "fat" sem o shadowJar.
    // Para evitar o erro do shadowJar, vamos usar a dependência normal e 
    // criar um jar simples. 
    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-tree:9.7'
}

jar {
    archiveFileName = 'nxagent.jar'
    manifest {
        attributes(
            'Premain-Class': 'NexuSkin.NxAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            'Implementation-Title': 'NexuSkin Agent',
            'Implementation-Version': project.version
        )
    }
}

// Como não usamos ShadowJar, precisamos de um jeito de incluir o ASM dentro do JAR.
// Vamos criar uma tarefa simples de "fatjar" manualmente.
task fatJar(type: Jar) {
    archiveFileName = 'nxagent.jar'
    manifest {
        attributes(
            'Premain-Class': 'NexuSkin.NxAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

compileJava {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}
